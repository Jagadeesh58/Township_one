services:
  db:
    image: postgres:15-alpine
    container_name: township_one_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-township}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-township_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-township_one}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-township} -d ${POSTGRES_DB:-township_one}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: township_one_postgres_data
