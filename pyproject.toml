# Township One - Python Project Configuration
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "township-one"
version = "1.0.0"
description = "Township One — Gated Township Resident & Operations Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.1.0",
    "pillow>=10.0.0",
    "scikit-learn==1.8.0",
    "cloudinary>=1.44.1,<2",
]

[project.optional-dependencies]
r2 = ["boto3>=1.35.0,<2"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "B008",  # Allow Depends/Query/File/Form in FastAPI endpoint parameters
    "E712",  # Allow Model.boolean_col == True/False in SQLAlchemy filters
    "E501",  # Line length handled by ruff format
    "B904",  # Allow re-raising FastAPI HTTPException
    "UP042", # Allow (str, Enum) inheritance for Pydantic schema serialization
]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
    "reportlab.*",
    "PIL.*",
]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "cloudinary.*",
    "botocore.*",
]
ignore_missing_imports = true
