title = "Township One Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Strict allowlist for development template placeholders and local defaults"
regexes = [
    # Safe CI pipeline and local development test placeholders
    '''(?i)ci-test-secret-key''',
    '''(?i)township_dev_password''',
    '''(?i)replace-with-a-strong-random''',
    '''(?i)CHANGE_ME''',
    '''(?i)test-secret''',
    '''(?i)gsk_test_''',
    '''(?i)-----BEGIN PRIVATE KEY-----''',
    '''(?i)-----BEGIN EC PRIVATE KEY-----''',
]
paths = [
    # Safe example environment template containing dummy variable placeholders
    '''^\.env\.example$''',
    # Safe local Docker Compose configuration with development credentials
    '''^docker-compose\.yml$''',
    '''^tests/.*''',
]
