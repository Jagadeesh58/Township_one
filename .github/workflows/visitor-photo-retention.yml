name: Visitor photo retention

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visitor-photo-retention
  cancel-in-progress: false

jobs:
  purge-expired-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate scheduler configuration
        shell: bash
        env:
          TOWNSHIP_API_URL: ${{ secrets.TOWNSHIP_API_URL }}
          RETENTION_JOB_TOKEN: ${{ secrets.RETENTION_JOB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOWNSHIP_API_URL" || { echo "Missing TOWNSHIP_API_URL secret" >&2; exit 1; }
          test -n "$RETENTION_JOB_TOKEN" || { echo "Missing RETENTION_JOB_TOKEN secret" >&2; exit 1; }
      - name: Purge visitor photos older than 90 days
        shell: bash
        env:
          TOWNSHIP_API_URL: ${{ secrets.TOWNSHIP_API_URL }}
          RETENTION_JOB_TOKEN: ${{ secrets.RETENTION_JOB_TOKEN }}
        run: |
          set -euo pipefail
          base_url="${TOWNSHIP_API_URL%/}"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            -X POST "${base_url}/api/v1/ops/retention/visitor-photos" \
            -H "X-Retention-Job-Token: ${RETENTION_JOB_TOKEN}" \
            -H "Accept: application/json"
          printf '\n'
