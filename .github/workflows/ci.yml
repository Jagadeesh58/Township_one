name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./township_one.db
      TEST_DATABASE_URL: sqlite:///./township_one_test.db
      TOWNSHIP_ENV: test
      SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
      DEMO_AS_OF_DATE: "2026-11-06T00:00:00Z"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations on fresh DB
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build
