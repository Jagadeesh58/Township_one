name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: township_user
          POSTGRES_PASSWORD: township_pass
          POSTGRES_DB: township_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://township_user:township_pass@localhost:5432/township_app
      TEST_DATABASE_URL: postgresql+psycopg://township_user:township_pass@localhost:5432/township_test
      PG_DATABASE_URL: postgresql+psycopg://township_user:township_pass@localhost:5432/township_test
      TOWNSHIP_ENV: test
      SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
      DEMO_AS_OF_DATE: "2026-11-06T00:00:00Z"
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality Checks
        run: |
          ruff check backend
          ruff format --check backend
          mypy backend/app

      - name: Prepare Postgres databases
        run: |
          python -c "import psycopg; conn = psycopg.connect('postgresql://township_user:township_pass@localhost:5432/postgres', autocommit=True); conn.execute('CREATE DATABASE township_app;'); conn.close()"

      - name: Run Alembic migrations and verify zero schema drift
        run: |
          alembic upgrade head
          alembic check

      - name: Verify Seed Script on Postgres
        run: |
          python scripts/seed.py --mode reset-demo --confirm-local-demo

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest tests/ --cov=backend/app --cov-report=term -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm test

      - name: Build
        run: npm run build
